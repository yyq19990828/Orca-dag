name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v), e.g. 0.2.0"
        required: true

jobs:
  npm:
    name: Publish orca-orchestration-launcher to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm exchanges this GitHub OIDC identity for a short-lived publish
      # credential. The trusted publisher must allow this exact workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node >=22.14 and npm >=11.5.1.
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - run: npm ci

      # The tag is the version of record; scripts/build-npm.mjs writes it into
      # the staged package.json so the repo's own package.json never has to be
      # bumped in a commit.
      - name: Stage npm package
        run: node scripts/build-npm.mjs
        env:
          PKG_VERSION: ${{ inputs.version || github.ref_name }}

      # npm detects Actions OIDC automatically and generates provenance for
      # this public package. No long-lived npm token is stored in GitHub.
      - name: Publish with npm Trusted Publishing
        run: npm publish ./dist-npm --access public

  binaries:
    name: Build + attach standalone binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Compile for every target
        run: bash scripts/build-all-binaries.sh

      # For people without Node: a single ~60 MB file that only needs the `orca`
      # CLI on PATH. Draft-free, notes generated from the commit range.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/orca-dag-* dist/SHA256SUMS.txt --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
