name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The checks that matter: "does it still typecheck", "do the security tests
# pass", and "does the thing users run actually boot".
jobs:
  check:
    name: Typecheck + tests + package smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Dependency advisories: the plan requires no *fixable* high findings in
      # compatible ranges (majors are deferred on purpose). Patch refreshes land
      # via `npm audit fix`; a new advisory fails here until it is either
      # patched in-range or explicitly explained in the release notes.
      - name: Audit dependencies (no fixable high findings)
        run: npm audit --audit-level=high

      # One gate, identical locally and in CI: skill validation (frontmatter +
      # runtime-guide drift guards), server typecheck, server tests, web
      # typecheck + build. Keep it in lockstep with the root `check` script.
      - name: Check (skill + typecheck + tests + web build)
        run: npm run check

      - name: Stage npm package
        run: node scripts/build-npm.mjs

      # The viewer needs the `orca` CLI for anything real, and Orca is a desktop
      # runtime we can't install here — so the smoke test covers exactly the part
      # that is CI-checkable: the published tarball boots on plain Node, serves
      # its API, and serves the built SPA from disk.
      - name: Smoke test the staged package
        run: |
          set -euo pipefail
          npm pack ./dist-npm --pack-destination /tmp
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          # The tarball is named after the published package (`npm pack`), not the bin.
          npm install /tmp/orca-orchestration-launcher-*.tgz >/dev/null
          NO_OPEN=1 PORT=8899 npx orca-dag &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8899/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -sf http://127.0.0.1:8899/ | grep -qi '<div id="root">'
          echo "✅ npx orca-dag boots and serves the SPA"

          # Security contract of the packed artifact: loopback-only binding,
          # token-gated mutations, and a session endpoint for the same-origin
          # client. run-stop is a safe no-op mutation (idle coordinator), so it
          # proves a *successful* authorized mutation without touching Orca.
          ss -tln | grep -q '127.0.0.1:8899' && ! ss -tln | grep -qE '(0\.0\.0\.0|\*|::):8899'
          echo "✅ server socket is loopback-only"
          if curl -sf -X POST http://127.0.0.1:8899/api/run-stop >/dev/null 2>&1; then
            echo "mutation without a token must not succeed" >&2; exit 1
          fi
          echo "✅ mutation without X-Orca-Dag-Token is refused"
          # The token is 256 bits of base64url (43 chars, [A-Za-z0-9_-]).
          TOKEN=$(curl -sf http://127.0.0.1:8899/api/session | sed -E 's/.*"token":"([A-Za-z0-9_-]{43})".*/\1/')
          test -n "$TOKEN"
          curl -sf -X POST -H "X-Orca-Dag-Token: $TOKEN" http://127.0.0.1:8899/api/run-stop | grep -q '"ok":true'
          echo "✅ token-bearing mutation succeeds"

      # Startup writes the skill into the user's agent directories, so the
      # uninstall path has to keep taking it back — otherwise the install is a
      # one-way door. Round trip against a throwaway HOME so the runner's own
      # config is never involved.
      - name: Skill install/uninstall round trip
        run: |
          set -euo pipefail
          mkdir -p /tmp/fakehome/.claude
          cd /tmp/smoke
          HOME=/tmp/fakehome NO_OPEN=1 PORT=8897 timeout 5 ./node_modules/.bin/orca-dag || true
          test -f /tmp/fakehome/.claude/skills/orca-dag/SKILL.md
          # The freshly installed skill must be the thin workflow that loads the
          # runtime-matched orchestration guide — not a stale command copy.
          grep -q 'skills get orchestration' /tmp/fakehome/.claude/skills/orca-dag/SKILL.md
          HOME=/tmp/fakehome ./node_modules/.bin/orca-dag uninstall | grep -q removed
          test ! -e /tmp/fakehome/.claude/skills/orca-dag
          echo "✅ install and uninstall stay symmetric"

  binary:
    name: Bun binary build
    # Each binary embeds a whole Bun runtime (~100 MB), so building the full
    # five-target set on every PR would cost minutes and hundreds of MB for no
    # extra signal. One target proves the embed-and-compile path still works;
    # the release workflow builds the rest.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Compile the viewer binary
        run: TARGET=bun-linux-x64 OUT_NAME=orca-dag-linux-x64 node scripts/build-binary.mjs

      - name: Check the binary starts
        run: |
          set -euo pipefail
          # Throwaway HOME with a pre-existing agent skills dir: the binary must
          # embed and install the *updated* thin skill, proving the compile-time
          # embed (SKILL_MD) picked up the current skill/SKILL.md.
          mkdir -p /tmp/binhome/.claude
          chmod +x dist/orca-dag-linux-x64
          HOME=/tmp/binhome NO_OPEN=1 PORT=8898 ./dist/orca-dag-linux-x64 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8898/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8898/api/health | grep -q '"ok":true'
          # The binary serves its SPA from the base64 map embedded at compile
          # time, so this also proves the embedding step produced real assets.
          curl -sf http://localhost:8898/ | grep -qi '<div id="root">'
          # Same for the skill: embedded, installed, and guide-loading.
          test -f /tmp/binhome/.claude/skills/orca-dag/SKILL.md
          grep -q 'skills get orchestration' /tmp/binhome/.claude/skills/orca-dag/SKILL.md
          echo "✅ binary embeds and installs the updated thin skill"
          # Same security contract as the npm package: loopback-only socket and
          # token-gated mutations.
          ss -tln | grep -q '127.0.0.1:8898'
          if curl -sf -X POST http://localhost:8898/api/run-stop >/dev/null 2>&1; then
            echo "mutation without a token must not succeed" >&2; exit 1
          fi
          echo "✅ binary boots, serves the embedded SPA, and is loopback + token locked"
